name: Daily Cloud Health Check

on:
  schedule:
    # 11:00 UTC = 04:30 PM IST (daily audit after the 03:45 PM IST scrape)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Test Dependencies
        run: pip install --quiet requests

      - name: Run Unit Tests
        run: python -m unittest -v test_pipeline.py

      - name: Verify Live CDN & Data Freshness
        id: check
        run: python health_check.py

      - name: Send Daily Telegram Report
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "Telegram credentials not configured. Skipping report."
            exit 0
          fi
          MSG="${HEALTH_MSG:-🚨 BharatMandi Daily Check failed before health_check.py ran!}"
          if [ "${{ job.status }}" != "success" ]; then
            MSG="${MSG}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true

      - name: Create GitHub Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Health Check Failed: Run ${context.runId}`,
              body: `Daily cloud health check failed.\n\nInspect logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['health-check-failure', 'automated']
            });
